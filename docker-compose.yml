version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: marvin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fraud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marvin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://marvin:${DB_PASSWORD}@postgres:5432/fraud
      API_KEY: ${API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}   # <-- Added this line
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
