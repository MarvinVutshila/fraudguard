name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/fraudguard
            git pull origin main
            sudo systemctl restart fraudguard.service
            cd frontend
            export VITE_API_BASE_URL="http://13.40.181.181:8000"
            docker-compose build frontend
            docker-compose up -d frontend
